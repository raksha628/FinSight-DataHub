# ═══════════════════════════════════════════════════════════════════════════════
# FinSight DataHub — Spring Boot Application Configuration (Master)
# Profile-specific overrides: application-dev.yml, application-prod.yml
# ═══════════════════════════════════════════════════════════════════════════════

spring:
  application:
    name: FinSight DataHub

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ── DataSource (PostgreSQL) ────────────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finsight_db}
    username: ${SPRING_DATASOURCE_USERNAME:finsight_user}
    password: ${SPRING_DATASOURCE_PASSWORD:finsight_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FinsightHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      connection-test-query: SELECT 1

  # ── JPA / Hibernate ─────────────────────────────────────────────────────────
  jpa:
    open-in-view: false                   # Prevents lazy-loading anti-pattern
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50                  # Batch inserts for ETL performance
          order_inserts: true
          order_updates: true
        default_schema: public

  # ── Flyway (Database Migrations) ─────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false



  # ── File Upload ──────────────────────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

  # ── Jackson (JSON Serialization) ─────────────────────────────────────────────
  jackson:
    date-format: yyyy-MM-dd
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: NON_NULL

# ── Server ────────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    include-message: always
    include-binding-errors: always
    whitelabel:
      enabled: false

# ── JWT ─────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:default-dev-secret-change-in-production-must-be-256-bits-long}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours







# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    app:
      enabled: true

info:
  app:
    name: FinSight DataHub
    version: 1.0.0
    description: Financial Data Ingestion and Analytics Platform

# ── OpenAPI / Swagger ─────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.finsight: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
  file:
    name: logs/finsight-datahub.log
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
