version: '3.9'

# ═══════════════════════════════════════════════════════════════════
# FinSight DataHub — Docker Compose
# Orchestrates: Spring Boot App + PostgreSQL 15 + Redis 7
#
# Usage:
#   Start:   docker-compose up -d
#   Stop:    docker-compose down
#   Rebuild: docker-compose up -d --build
#   Logs:    docker-compose logs -f finsight-app
# ═══════════════════════════════════════════════════════════════════

services:

  # ────────────────────────────────────────────
  # PostgreSQL 15 — Primary Data Store
  # ────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: finsight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finsight_db}
      POSTGRES_USER: ${POSTGRES_USER:-finsight_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finsight_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finsight-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finsight_user} -d ${POSTGRES_DB:-finsight_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s



  # ────────────────────────────────────────────
  # FinSight DataHub — Spring Boot Application
  # Serves both REST APIs and React frontend
  # ────────────────────────────────────────────
  finsight-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finsight-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-finsight_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-finsight_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-finsight_pass}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}

      # App
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - finsight-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# ────────────────────────────────────────────
# Volumes
# ────────────────────────────────────────────
volumes:
  postgres_data:
    name: finsight_postgres_data


# ────────────────────────────────────────────
# Networks
# ────────────────────────────────────────────
networks:
  finsight-network:
    name: finsight-network
    driver: bridge
